# SPA en Netlify (Base directory = frontend).

[build]
  command = "npm run build"
  publish = "dist"

  # Variables VITE_* que exige el build; no son secretos.
  [build.environment]
    NODE_VERSION = "24"
    VITE_API_BASE_URL = "/"
    VITE_API_PREFIX = "/api"
    VITE_CURRENCY_LOCALE = "es-CO"
    VITE_CURRENCY_CODE = "COP"

# /api/* va por proxy al ALB; reemplaza <DNS-DEL-ALB> (kubectl -n bookstore get ingress).
[[redirects]]
  from = "/api/*"
  to = "http://<DNS-DEL-ALB>/api/:splat"
  status = 200
  force = true

# Rutas de la SPA (react-router): cualquier otra ruta entrega index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
