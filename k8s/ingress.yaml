# Entrada al cluster: un Application Load Balancer (EKS Auto Mode) que
# publica /api hacia el BFF. La SPA no pasa por aqui: Cloudflare envia
# /* al bucket S3 y /api/* a este ALB.
#
# IngressClass y IngressClassParams son recursos del cluster (no tienen
# namespace); el Ingress si vive en "bookstore".
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
  # Por defecto el ALB descubre las subredes publicas por sus etiquetas.
  # Si no las encuentra, indicalas aqui:
  # subnets:
  #   ids:
  #     - subnet-REPLACE_PUBLIC_A
  #     - subnet-REPLACE_PUBLIC_B
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore
  namespace: bookstore
  annotations:
    # Envia el trafico directo a la IP de cada pod (no a los nodos)
    alb.ingress.kubernetes.io/target-type: ip
    # El ALB considera sano un pod si /health responde 200
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 5001
