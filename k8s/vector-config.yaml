# Sidecar Vector (BFF y Events): lee el clickstream del volumen compartido y lo envia a S3.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: bookstore
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      clickstream:
        type: file
        include:
          - /logs/clickstream.log
        read_from: beginning

    sinks:
      s3:
        type: aws_s3
        inputs:
          - clickstream
        bucket: "${S3_BUCKET}"
        region: "${AWS_REGION}"
        # Un prefijo por servicio y pod: dos replicas nunca escriben el mismo objeto
        key_prefix: "clickstream/${SERVICE_NAME}/${POD_NAME}/%Y/%m/%d/"
        compression: gzip
        encoding:
          codec: text
        batch:
          timeout_secs: 60
          max_bytes: 5000000
