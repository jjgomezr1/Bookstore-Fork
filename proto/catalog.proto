syntax = "proto3";

package catalog;

service Catalog {
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
  rpc GetBookByIsbn(GetBookByIsbnRequest) returns (Book);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message Book {
  string book_id = 1;
  string isbn = 2;
  string title = 3;
  string author = 4;
  string description = 5;
  string category = 6;
  string publisher = 7;
  int32 publication_year = 8;
  string price = 9;
  int32 stock = 10;
  string image = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListBooksRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListBooksResponse {
  repeated Book books = 1;
}

message GetBookByIsbnRequest {
  string isbn = 1;
}

message ReserveStockItem {
  string book_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  repeated ReserveStockItem items = 1;
}

message ReservedBook {
  string book_id = 1;
  string isbn = 2;
  string title = 3;
  string author = 4;
  string unit_price = 5;
  int32 quantity = 6;
}

message ReserveStockResponse {
  string reservation_id = 1;
  repeated ReservedBook books = 2;
}

message ReleaseStockItem {
  string book_id = 1;
  int32 quantity = 2;
}

message ReleaseStockRequest {
  string reservation_id = 1;
  repeated ReleaseStockItem items = 2;
}

message ReleaseStockResponse {
  bool released = 1;
}